[package]
name = "playground"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
evalite = { version = "0.3.0", path = "../crates/evalite" }
evalite-sockel = { version = "0.3.0", path = "../crates/evalite-sockel" }
gloo-timers = { version = "0.4.1", features = ["futures"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sockel = { version = "0.4.1", features = ["code-editor"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlElement", "HtmlTextAreaElement", "HtmlDocument", "InputEvent", "DomRect", "Location", "History", "Navigator", "Clipboard"] }
yew = { version = "0.23", features = ["csr"] }

[build-dependencies]
evalite-sockel = { version = "0.3.0", path = "../crates/evalite-sockel" }
sockel-build = "0.4.1"
