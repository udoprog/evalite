[package]
name = "evalite-cli"
version = "0.1.1"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition.workspace = true
rust-version.workspace = true
description = "The command line for evalite: small, strictly typed expressions that are safe to run on anyone's input."
documentation = "https://docs.rs/evalite"
readme = "README.md"
repository = "https://github.com/udoprog/evalite.git"
license = "MIT OR Apache-2.0"
keywords = ["cli", "eval", "expression", "formula"]
categories = ["command-line-utilities"]

[[bin]]
name = "evalite"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
evalite = { version = "0.1.1", path = "../evalite" }
