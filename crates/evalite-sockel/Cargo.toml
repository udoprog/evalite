[package]
name = "evalite-sockel"
version = "0.4.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition.workspace = true
rust-version.workspace = true
description = "Yew components for writing evalite expressions, styled with sockel."
documentation = "https://docs.rs/evalite"
readme = "README.md"
repository = "https://github.com/udoprog/evalite.git"
license = "MIT OR Apache-2.0"
keywords = ["editor", "evalite", "expression", "formula", "yew"]
categories = ["gui", "wasm", "web-programming"]

[lints]
workspace = true

[dependencies]
evalite = { version = "0.4.0", path = "../evalite" }
gloo-timers = "0.4.1"
phrasebook = { version = "0.2", features = ["yew023"] }
sockel = { version = "0.4.1", default-features = false, features = ["badge", "button", "code-editor", "disclosure", "field", "input", "layout", "notice", "property-list"] }
yew = "0.23"

[dev-dependencies]
sockel-build = "0.4.1"
