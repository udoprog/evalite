[package]
name = "shexel"
edition = "2024"
publish = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"

[lib]
bench = false

[dependencies]
musli = { version = "0.2.1", default-features = false, features = ["alloc", "std", "storage"] }
syntree = "0.19.0"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "shexel"
harness = false
