[package]
name = "evalite-compare"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Benchmarks comparing evalite against evalexpr and fasteval."
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[lib]
bench = false

[[bin]]
name = "evalite-compare"
path = "src/main.rs"
bench = false

[[bench]]
name = "compare"
harness = false

[dependencies]
evalexpr = "14.0.0"
evalite = { version = "0.1.2", path = "../evalite" }
fasteval = "0.2.4"
jiff = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
