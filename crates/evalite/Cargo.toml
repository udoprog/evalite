[package]
name = "evalite"
version = "0.4.2"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition.workspace = true
rust-version.workspace = true
description = "Small, strictly typed expressions that are safe to run on anyone's input."
documentation = "https://docs.rs/evalite"
readme = "README.md"
repository = "https://github.com/udoprog/evalite.git"
license = "MIT OR Apache-2.0"
keywords = ["eval", "expression", "formula", "language", "sandbox"]
categories = ["compilers", "parser-implementations"]

[lints]
workspace = true

[lib]
bench = false

[dependencies]
musli = { version = "0.2.1", default-features = false, features = ["alloc", "std", "storage"] }
syntree = "0.20.1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "evalite"
harness = false
