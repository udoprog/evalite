[package]
name = "evalite"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
bench = false

[dependencies]
musli = { version = "0.2.1", default-features = false, features = ["alloc", "std", "storage"] }
syntree = "0.19.0"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "evalite"
harness = false
